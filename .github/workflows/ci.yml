name: M2 Build and Test

on:
  push:
    branches: [ "**" ] # Ab ye saari branches par chalega
  pull_request:
    branches: [ "m2-actions", "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2

    - name: Install Pillow (for contact sheet)
      run: pip install pillow

    - name: Run tests
      run: cargo test --all-targets

    - name: Build release binary
      run: cargo build --release

    - name: Print binary size
      run: ls -lh target/release/lkj-engine

    - name: Generate Example Assets (Dummy Parts)
      run: python3 examples/generate_assets.py

    - name: Run Render Engine on Example (M2)
      run: ./target/release/lkj-engine examples/job.json examples/frames examples/

    - name: Create Contact Sheet
      run: python3 examples/make_contact_sheet.py

    - name: Upload Contact Sheet Artifact
      uses: actions/upload-artifact@v4
      with:
        name: m2-walk-contact-sheet
        path: examples/contact_sheet.png

    - name: Upload Output Frames Artifact
      uses: actions/upload-artifact@v4
      with:
        name: m2-rendered-frames
        path: examples/frames/
