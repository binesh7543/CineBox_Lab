name: M1 Build and Test

on:
  push:
    branches: [ "m1-core-types" ]
  pull_request:
    branches: [ "m1-core-types", "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2

    - name: Run tests
      run: cargo test --all-targets

    - name: Build release binary
      run: cargo build --release

    - name: Print binary size
      run: ls -lh target/release/lkj-engine

    - name: Generate Example Assets
      run: python3 examples/generate_assets.py

    - name: Run Render Engine on Example
      run: ./target/release/lkj-engine examples/job.json examples/out.png examples/

    - name: Upload Output Frame as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: m1-rendered-frame
        path: examples/out.png
