name: M2 Build and Test

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2

    - name: Install Python dependencies
      run: pip install pillow

    - name: Run tests
      run: cargo test --all-targets

    - name: Build release binary
      run: cargo build --release

    - name: Print binary size
      run: ls -lh target/release/lkj-engine

    - name: Generate Example Assets
      run: python3 examples/generate_assets.py

    - name: Run Render Engine on Example
      run: ./target/release/lkj-engine examples/job.json examples/out.png examples/

    - name: Generate Contact Sheet
      run: python3 examples/make_contact_sheet.py

    - name: Upload Output Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: m2-rendered-outputs
        path: |
          examples/out.png
          examples/contact_sheet.png
          
